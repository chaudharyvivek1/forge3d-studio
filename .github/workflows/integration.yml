name: integration

# The cross-repository contract. It refuses to run without the private platform
# package: a green build that skipped every integration test would be worse than
# a red one.
#
# Fork pull requests never receive repository secrets, so this workflow does not
# run for them — and says so out loud rather than reporting a pass it did not
# earn.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  cross-repository:
    name: studio x billing-auth
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Require the platform credential
        env:
          BILLING_AUTH_TOKEN: ${{ secrets.BILLING_AUTH_TOKEN }}
        run: |
          if [ -z "$BILLING_AUTH_TOKEN" ]; then
            echo "::error::BILLING_AUTH_TOKEN is not set. This workflow tests the"
            echo "::error::studio/platform contract and must not pass by skipping."
            echo "::error::Add a read-only token for the private repository under"
            echo "::error::Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Install
        env:
          BILLING_AUTH_TOKEN: ${{ secrets.BILLING_AUTH_TOKEN }}
        run: |
          python -m pip install --upgrade pip
          pip install "forge3d @ git+https://github.com/chaudharyvivek1/forge3d.git"
          # The token goes into the URL, so git must not be allowed to echo it.
          pip install "forge3d-billing-auth @ git+https://x-access-token:${BILLING_AUTH_TOKEN}@github.com/chaudharyvivek1/forge3d-billing-auth.git"

      - name: Prove the right platform package is installed
        run: |
          python - <<'PY'
          import billing_auth
          from billing_auth.billing import BillingService
          print("billing_auth", billing_auth.__version__, "from", billing_auth.__file__)
          assert hasattr(BillingService, "page_for_app"), "stale platform package"
          PY

      - name: Integration tests (a skip is a failure)
        env:
          REQUIRE_INTEGRATION: "1"
        run: |
          pytest -q -m "not slow" \
            tests/test_central_client.py \
            tests/test_integration_central.py \
            tests/test_hardening.py \
            tests/test_pagination_recovery.py

  fork-notice:
    name: integration skipped (fork)
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Say plainly that nothing ran
        run: |
          echo "::notice::Integration tests did not run for this fork pull request."
          echo "::notice::Secrets are not exposed to forks. A maintainer must run"
          echo "::notice::the integration workflow on this branch before merging."
