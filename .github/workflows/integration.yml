name: integration

# The protected workflow. Unlike `ci`, this one refuses to run without the
# private platform credential: a green build that silently skipped every
# cross-repository test would be worse than a red one.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  cross-repository:
    name: studio x billing-auth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require the platform credential
        env:
          BILLING_AUTH_TOKEN: ${{ secrets.BILLING_AUTH_TOKEN }}
        run: |
          if [ -z "$BILLING_AUTH_TOKEN" ]; then
            echo "::error::BILLING_AUTH_TOKEN is not set. This workflow tests the"
            echo "::error::studio/platform contract and must not pass by skipping."
            exit 1
          fi

      - name: Install
        env:
          BILLING_AUTH_TOKEN: ${{ secrets.BILLING_AUTH_TOKEN }}
        run: |
          python -m pip install --upgrade pip
          pip install "forge3d @ git+https://github.com/chaudharyvivek1/forge3d.git"
          pip install "forge3d-billing-auth @ git+https://x-access-token:${BILLING_AUTH_TOKEN}@github.com/chaudharyvivek1/forge3d-billing-auth.git"
          pip install -e ".[dev]"

      - name: Prove the platform package is importable
        run: python -c "import billing_auth; print('billing-auth', billing_auth.__version__)"

      - name: Integration tests (skips are failures)
        env:
          REQUIRE_INTEGRATION: "1"
        run: |
          pytest -q tests/test_central_client.py tests/test_integration_central.py tests/test_hardening.py

      - name: Full suite
        env:
          REQUIRE_INTEGRATION: "1"
        run: pytest -q
