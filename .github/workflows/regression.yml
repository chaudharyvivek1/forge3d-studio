name: regression

# Everything, on every supported platform, including the slow tests that make
# hundreds of real round trips through the in-process platform. Nightly and on
# main, because it is the only place the >1,000-reservation paths execute.
#
# This carries the cross-platform full-suite coverage that the old `ci.yml`
# provided, without its Windows-breaking shell conditional.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  full:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Require the platform credential
        env:
          BILLING_AUTH_TOKEN: ${{ secrets.BILLING_AUTH_TOKEN }}
        run: |
          if [ -z "$BILLING_AUTH_TOKEN" ]; then
            echo "::error::BILLING_AUTH_TOKEN is not set; the full regression run"
            echo "::error::cannot be claimed to have passed."
            exit 1
          fi

      - name: Install
        env:
          BILLING_AUTH_TOKEN: ${{ secrets.BILLING_AUTH_TOKEN }}
        run: |
          python -m pip install --upgrade pip
          pip install "forge3d @ git+https://github.com/chaudharyvivek1/forge3d.git"
          pip install "forge3d-billing-auth @ git+https://x-access-token:${BILLING_AUTH_TOKEN}@github.com/chaudharyvivek1/forge3d-billing-auth.git"
          pip install -e ".[dev]"

      - name: Full suite
        env:
          REQUIRE_INTEGRATION: "1"
        run: pytest -q
