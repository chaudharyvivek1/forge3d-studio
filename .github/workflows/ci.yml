name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # forge3d is not on PyPI yet, so studio's engine dependency comes from
          # the repository. This is the one line to change when it is published.
          pip install "forge3d @ git+https://github.com/chaudharyvivek1/forge3d.git"
          pip install -e ".[dev]"

      - name: Install the private central platform
        env:
          BILLING_AUTH_TOKEN: ${{ secrets.BILLING_AUTH_TOKEN }}
        run: |
          # Studio does not depend on this package at runtime — it speaks HTTP.
          # The integration tests do, so without the secret they are skipped.
          if [ -n "$BILLING_AUTH_TOKEN" ]; then
            pip install "forge3d-billing-auth @ git+https://x-access-token:${BILLING_AUTH_TOKEN}@github.com/chaudharyvivek1/forge3d-billing-auth.git"
          else
            echo "::warning::BILLING_AUTH_TOKEN is not set — central integration tests will be skipped"
          fi

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest -q
