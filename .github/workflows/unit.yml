name: unit

# Fast, credential-free, and cross-platform.
#
# `defaults.run.shell: bash` is deliberate: GitHub's Windows runners default to
# PowerShell, and a multi-line shell script written for bash fails there with a
# ParserError. Setting the shell once is what stops that recurring.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  unit:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "forge3d @ git+https://github.com/chaudharyvivek1/forge3d.git"
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Compile
        run: python -m compileall -q src tests

      - name: Unit tests (no private credentials)
        run: pytest -q tests/test_central_client.py
