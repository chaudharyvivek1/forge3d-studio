name: unit

# Fast, self-contained, and needs no private credential. These are the tests
# that exercise studio's own logic; everything touching the platform lives in
# the `integration` and `regression` workflows.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "forge3d @ git+https://github.com/chaudharyvivek1/forge3d.git"
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Compile
        run: python -m compileall -q src tests
      - name: Unit tests
        run: pytest -q tests/test_central_client.py
